# Staging: the shared edge Caddy (docker_default network) proxies
# kiemtien.staging.maveragroups.com to this container; no host port is published.
name: kiemtien
services:
  web:
    build: .
    container_name: kiemtien-web
    restart: unless-stopped
    volumes:
      - kiemtien-data:/data
    networks:
      - caddy
networks:
  caddy:
    name: docker_default
    external: true
volumes:
  kiemtien-data:
