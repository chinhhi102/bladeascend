# CI — chặn những lỗi đã THẬT SỰ lọt tới người chơi, không phải chặn cho có.
#
# Mỗi bài kiểm dưới đây ra đời từ một lỗi cụ thể đã xảy ra:
#   - check:assets       → ngày 30/10 đội test chơi bản có 12 khung placeholder (NETCODE §5.1)
#   - check:items        → Bí Kíp hiện ra vòng tròn trắng vì tra nhầm thư mục art
#   - check:telemetry-off→ bản release không được đóng gói module telemetry (TELEMETRY §1.6)
#   - check:wire         → mã hoá nhị phân hai phía phải khớp từng byte (NETCODE §4.9)
#   - assets:budget      → lần tải đầu từng là 77,4 MB và người chơi bỏ game vì chờ (§13.7)
#   - go test -race      → 6 lỗi tranh chấp dữ liệu giữa các goroutine khu đã bắt được
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Repo công khai: không để guest_id đầy đủ hay IP người chơi lọt vào docs/ (CLAUDE.md quy
  # tắc 15). Rẻ nhất trong mọi bài — chạy riêng để đỏ ngay, không chờ build.
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: không có dữ liệu người chơi trong docs/
        run: node tools/check-privacy.mjs

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go vet
        working-directory: server
        run: go vet ./...
      # `-race` chứ không chỉ `go test`: mỗi khu chạy một goroutine riêng, và lỗi tranh chấp
      # dữ liệu ở đó không làm test đỏ — nó làm SERVER SẬP giữa trận, lúc có người đang chơi.
      - name: go test -race
        working-directory: server
        run: go test -race ./...
      # Sinh lại từ schema rồi kiểm KHÔNG có gì đổi. Ai sửa `proto/schema.txt` mà quên chạy
      # generator thì code sinh ra và schema lệch nhau — và lệch kiểu đó không làm hỏng build,
      # nó chỉ làm client đọc rác lúc chạy.
      # §8.1b "Kiểm tra bắt buộc": 5 khu × 14 cảnh giới, flood fill lưới 50. Trượt nghĩa là
      # có cảnh giới nào đó bị NHỐT trong một túi kín, hoặc không tới được một cái Đài — tức
      # người chơi ở cảnh giới đó mở game ra và không chơi được. Phải chặn ở CI vì cả hai
      # cách làm hỏng nó đều im lặng: sinh lại bản đồ với seed khác, hoặc sửa .tmj bằng Tiled.
      - name: bố cục 5 khu đi lọt ở cả 14 cảnh giới (§8.1b)
        working-directory: server
        run: go run ./cmd/mapgen --check
      # Spec v6.24 §6.0 (Q33): bảng nhịp farm là CHUẨN. Lạm phát EXP 1/11 (Bí Kíp nhân đôi tu
      # vi, Luyện Hư → Đại Thừa 10 trong ~70 s) không làm đỏ test nào — chỉ người chơi thấy.
      # Mỗi bài ~1–2 phút: 4 khu × 12 bot farm trọn đường Luyện Khí → Đại Thừa 10.
      - name: nhịp farm thuần trúng bảng §6.0 (±25 %)
        working-directory: server
        run: go run ./cmd/sim --farm --seed 1
      - name: Nam Châm ≤ 1,5 lần bảng + Luyện Hư → Chân Tiên ≥ 15 phút
        working-directory: server
        run: go run ./cmd/sim --farm --magnet-always --seed 1
      - name: code sinh từ schema còn khớp
        working-directory: server
        run: |
          go run ./cmd/protogen
          git diff --exit-code -- internal/wire/wire_gen.go ../client/src/net/wire.gen.ts


  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Job này cần Go: gói mẫu đối chiếu do server sinh ra, và phải sinh TƯƠI mỗi lần chạy
      # chứ không dùng file commit sẵn — file commit sẵn sẽ cũ đi mà không ai biết.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: npm ci
        working-directory: client
        run: npm ci
      # Kiểm art TRƯỚC khi build: build xanh mà thiếu art thì vẫn ra một bản game vẽ
      # placeholder, và đó đúng là thứ đã lọt tới đội test.
      - name: thiếu art gây placeholder
        working-directory: client
        run: npm run check:assets
      - name: mọi loại vật phẩm có ảnh
        working-directory: client
        run: npm run check:items
      # Đối chiếu mã hoá hai phía: client giải mã gói server tạo ra, so từng trường, rồi mã
      # hoá ngược lại và so từng byte (NETCODE_SPEC §4.9).
      - name: sinh gói mẫu (Go)
        working-directory: server
        run: go run ./cmd/protofixture -o /tmp/wire.json
      - name: client giải mã khớp server
        working-directory: client
        run: npm run check:wire -- /tmp/wire.json
      # `tools/asset-pipeline` có node_modules riêng (sharp là thư viện nhị phân, GAME_SPEC
      # §13.7 mục 2 đã duyệt). `npm run build` gọi pipeline, nên phải cài trước.
      - name: npm ci (asset-pipeline)
        working-directory: tools/asset-pipeline
        run: npm ci
      # ffmpeg để nén lại âm thanh. Thiếu nó pipeline vẫn chạy (tệp âm thanh phát hành
      # nguyên trạng + một dòng cảnh báo), nhưng CI thì nên đúng như bản deploy.
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # `npm run build` tự chạy `assets:build` rồi `assets:budget` trước tsc/vite, nên bước
      # này đã gồm cả cổng ngân sách §13.7 mục 6 (boot ≤ 8 MB, tổng ≤ 80 MB).
      - name: build (asset-pipeline + ngân sách + tsc + vite)
        working-directory: client
        run: npm run build
      - name: bản release không chứa telemetry
        working-directory: client
        run: npm run check:telemetry-off
