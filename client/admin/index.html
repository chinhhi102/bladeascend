<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản trị — Kiếm Xoay Tu Tiên</title>
<link rel="stylesheet" href="/admin/admin.css">
</head><body>
<nav id="side">
  <h1>Kiếm Xoay</h1>
  <a href="#dashboard" class="on">Dashboard</a>
  <a href="#rooms">Phòng &amp; Khu</a>
  <a href="#audit">Nhật ký</a>
  <button id="logout">Đăng xuất</button>
  <div id="build"></div>
</nav>
<main>
  <section id="dashboard">
    <h2>Dashboard <small id="tick"></small></h2>
    <div class="cards" id="cards"></div>
    <h3>Phân bố cảnh giới (người thật)</h3>
    <div id="realms" class="realms"></div>
  </section>
  <section id="rooms" hidden>
    <h2>Phòng &amp; Khu</h2>
    <div id="roomlist"></div>
  </section>
  <section id="audit" hidden>
    <h2>Nhật ký thao tác</h2>
    <table id="audittbl"><thead><tr>
      <th>Thời gian</th><th>Hành động</th><th>Đối tượng</th><th>Lý do</th><th>IP</th>
    </tr></thead><tbody></tbody></table>
  </section>
</main>
<script type="module" src="/admin/admin.js"></script>
</body></html>
